name: Build Watch8 Binance Risk Compact v2 APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'Watch8_BinanceRisk_Compact_v2_OneUpload.zip'
      - 'Watch8_BinanceRisk_Compact_v2_FixedSDK_OneUpload.zip'
      - 'app/**'
      - 'tests/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'

jobs:
  build-watch8:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Avoid android-actions/setup-android@v3, which fails on some runners
      # when downloading/updating Android command-line tools.
      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT" || { echo "Android SDK not found: $SDK_ROOT"; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDK_MANAGER" && test -f "$SDK_MANAGER" || {
            echo "Preinstalled sdkmanager not found"; exit 1;
          }
          echo "SDK_MANAGER=$SDK_MANAGER" >> "$GITHUB_ENV"
          echo "Using SDK: $SDK_ROOT"
          echo "Using sdkmanager: $SDK_MANAGER"

      - name: Ensure Android 35 platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] ||
             [ ! -f "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]; then
            echo "Android 35 packages missing; installing only required packages"
            yes | "$SDK_MANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
            "$SDK_MANAGER" --sdk_root="$ANDROID_HOME" --install               'platforms;android-35' 'build-tools;35.0.0'
          else
            echo "Android 35 packages already installed; skipping SDK download"
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -f "$ANDROID_HOME/build-tools/35.0.0/aapt2"

      - name: Prepare source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-src
          if [ -f Watch8_BinanceRisk_Compact_v2_FixedSDK_OneUpload.zip ]; then
            unzip -q -o Watch8_BinanceRisk_Compact_v2_FixedSDK_OneUpload.zip -d android-src
          elif [ -f Watch8_BinanceRisk_Compact_v2_OneUpload.zip ]; then
            unzip -q -o Watch8_BinanceRisk_Compact_v2_OneUpload.zip -d android-src
          else
            cp -R app tests build.gradle settings.gradle gradle.properties android-src/
          fi
          test -f android-src/settings.gradle
          test -f android-src/app/src/main/java/com/httools/wearrisk/MainActivity.java
          test -f android-src/app/src/main/java/com/httools/wearrisk/RiskMath.java

      - name: Test risk calculations
        working-directory: android-src
        run: |
          mkdir -p /tmp/risk-test-classes
          javac -encoding UTF-8 -d /tmp/risk-test-classes             app/src/main/java/com/httools/wearrisk/RiskMath.java             tests/RiskMathRegression.java
          java -cp /tmp/risk-test-classes RiskMathRegression

      - name: Compile Wear OS APK
        working-directory: android-src
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Watch8-BinanceRisk-Compact-v2-APK
          path: android-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
